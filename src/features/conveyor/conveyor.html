<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esteiras | EcoCycle</title>
</head>
<body>
  <div id="app-topo"></div>
  <div class="app-corpo">
    <nav id="app-menu" class="menu" aria-label="Menu principal"></nav>
    <main class="conteudo-pagina">
      <header class="mb-4">
        <nav aria-label="Caminho da página">
          <ol class="breadcrumb small mb-2">
            <li class="breadcrumb-item"><a href="../dashboard/dashboard.html">Início</a></li>
            <li class="breadcrumb-item">Equipamentos</li>
            <li class="breadcrumb-item active" aria-current="page">Esteiras</li>
          </ol>
        </nav>
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
          <div>
            <h1 class="h3 mb-1">Esteiras</h1>
            <p class="text-body-secondary mb-0">Consulte os equipamentos e selecione uma esteira para ver os detalhes.</p>
          </div>
          <a class="btn btn-outline-secondary" href="conveyor-status.html"><i class="bi bi-activity me-1" aria-hidden="true"></i>Status das esteiras</a>
        </div>
      </header>
      <section aria-label="Consulta de esteiras">
        <div class="card shadow-sm mb-4"><div class="card-body">
          <label class="form-label" for="busca-esteiras">Buscar esteira</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
            <input id="busca-esteiras" type="search" class="form-control" placeholder="Busque por nome, código, tipo, local ou status" aria-controls="lista-esteiras">
          </div>
        </div></div>
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-3 small text-body-secondary">
          <span id="quantidade-esteiras" role="status" aria-live="polite"></span>
          <span id="ultima-atualizacao"></span>
        </div>
        <div id="estado-esteiras" class="estado" role="status"></div>
        <div id="lista-esteiras" class="esteiras-grid" aria-busy="true"></div>
      </section>
    </main>
  </div>
  <div class="modal fade" id="modal-esteira" tabindex="-1" aria-labelledby="titulo-modal-esteira" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="titulo-modal-esteira">Detalhes da esteira</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar detalhes"></button>
      </div>
      <div class="modal-body" id="detalhes-esteira"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
        <a id="link-status-esteira" class="btn btn-eco" href="conveyor-status.html">Ver status e leituras</a>
      </div>
    </div></div>
  </div>
  <script type="module" src="conveyor.js"></script>
</body>
</html>
