<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Produção | EcoCycle</title>
</head>
<body>
  <!-- topo, menu lateral e rodapé são preenchidos pelo layout.js -->
  <div id="app-topo"></div>
  <div class="app-corpo">
    <nav id="app-menu" class="menu" aria-label="Menu principal"></nav>
    <main class="conteudo-pagina">
      <h1 class="h4 mb-3">Produção diária</h1>
      <!-- Os filtros atualizam a tabela automaticamente; não há botão de filtro. -->
      <div class="card shadow-sm" id="bloco-producao">
        <div class="card-header bg-transparent d-flex gap-2 align-items-center justify-content-between">
          <span>Registros de produção</span>
          <button type="button" id="limpar-filtro" class="btn btn-link btn-sm text-body-secondary text-decoration-none">Limpar filtros</button>
        </div>
        <div class="px-3 pt-3" role="group" aria-label="Filtros de produção">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-lg-5">
              <label for="busca-producao" class="form-label small text-body-secondary mb-1">Buscar produção</label>
              <input type="search" id="busca-producao" class="form-control form-control-sm" placeholder="ID, lote, material…" autocomplete="off" aria-describedby="ajuda-filtros">
            </div>
            <fieldset class="col-12 col-lg-7 mb-0">
              <legend class="float-none w-auto small text-body-secondary mb-1">Período</legend>
              <div class="d-flex align-items-center gap-2">
                <div class="flex-grow-1 w-100">
                  <label for="filtro-data-inicial" class="visually-hidden">Data inicial</label>
                  <input type="date" id="filtro-data-inicial" class="form-control form-control-sm" aria-describedby="ajuda-filtros erro-periodo">
                </div>
                <span class="small text-body-secondary">até</span>
                <div class="flex-grow-1 w-100">
                  <label for="filtro-data-final" class="visually-hidden">Data final</label>
                  <input type="date" id="filtro-data-final" class="form-control form-control-sm" aria-describedby="ajuda-filtros erro-periodo">
                </div>
              </div>
            </fieldset>
          </div>
          <details class="mt-3">
            <summary class="small text-body-secondary">Mais filtros</summary>
            <div class="row g-3 pt-2">
              <div class="col-12 col-sm-6 col-lg-4">
                <label for="filtro-status" class="form-label small text-body-secondary mb-1">Status</label>
                <select id="filtro-status" class="form-select form-select-sm" aria-describedby="ajuda-filtros">
                  <option value="">Todos os status</option>
                </select>
              </div>
              <div class="col-12 col-sm-6 col-lg-4">
                <label for="filtro-turno" class="form-label small text-body-secondary mb-1">Turno</label>
                <select id="filtro-turno" class="form-select form-select-sm" aria-describedby="ajuda-filtros">
                  <option value="">Todos os turnos</option>
                </select>
              </div>
            </div>
          </details>
        </div>
        <span id="ajuda-filtros" class="visually-hidden">Os filtros são aplicados automaticamente. O período inclui as datas inicial e final. Deixe uma data vazia para não limitar esse lado do período. A busca aceita termos aproximados.</span>
        <div id="erro-periodo" class="text-danger small px-3 pt-2 d-none" role="alert"></div>
        <div class="card-body"><div class="estado"></div><div class="conteudo d-none"></div></div>
        <div id="resultado-filtros" class="card-footer bg-transparent small text-body-secondary d-none" aria-live="polite"></div>
      </div>

      <!-- Preenchido por production-details.js ao escolher "Ver dados" na tabela. -->
      <div class="modal fade" id="modal-detalhe-producao" tabindex="-1" aria-labelledby="titulo-detalhe-producao" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="titulo-detalhe-producao">Dados da produção</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body" id="detalhe-producao"></div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="production.js"></script>
</body>
</html>
