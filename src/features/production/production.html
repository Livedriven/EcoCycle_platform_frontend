<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produção | EcoCycle</title>
</head>
<body>
  <!-- topo, menu lateral e rodapé são preenchidos pelo layout.js -->
  <div id="app-topo"></div>
  <div class="app-corpo">
    <nav id="app-menu" class="menu" aria-label="Menu principal"></nav>
    <main class="conteudo-pagina">
      <h1 class="h4 mb-3">Produção diária</h1>
      <!-- Card da tabela: o cabeçalho tem o filtro por data; o corpo tem .estado e .conteudo -->
      <div class="card shadow-sm" id="bloco-producao">
        <div class="card-header d-flex flex-wrap gap-2 align-items-center justify-content-between">
          <span>Registros de produção</span>
          <div class="d-flex gap-2 align-items-center">
            <label for="filtro-data" class="small mb-0">Data</label>
            <input type="date" id="filtro-data" class="form-control form-control-sm w-auto">
            <button id="limpar-filtro" class="btn btn-outline-secondary btn-sm">Limpar</button>
          </div>
        </div>
        <div class="card-body"><div class="estado"></div><div class="conteudo d-none"></div></div>
      </div>
    </main>
  </div>
  <script type="module" src="production.js"></script>
</body>
</html>
