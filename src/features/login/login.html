<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | EcoCycle</title>
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login">
  <main class="card login-card shadow">
    <img class="logo" src="assets/logo.png" alt="EcoCycle Reciclagem Inteligente">
    <!-- novalidate: a validação é feita pelo login.js, não pelo navegador -->
    <form id="form-login" novalidate>
      <!-- mensagem de erro (escondida até o login.js mostrar) -->
      <div id="erro-login" class="alert alert-danger py-2 d-none" role="alert"></div>
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuário</label>
        <input id="usuario" class="form-control" autocomplete="username" autofocus>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input id="senha" type="password" class="form-control" autocomplete="current-password">
      </div>
      <button class="btn btn-entrar w-100" type="submit">Entrar</button>
    </form>
    <!-- lista de logins de teste, recolhida por padrão -->
    <details class="mt-3 small" style="color:var(--eco-texto-suave)">
      <summary>Usuários de teste</summary>
      admin / admin123 · gerente / gerente123<br>operador / operador123 · consulta / consulta123
    </details>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
