<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#084B60" />
    <title>Acesso negado | EcoCycle</title>
  </head>
  <body class="error-page">
    <main class="error-card" aria-labelledby="error-title">
      <a class="error-brand" href="/index.html" aria-label="EcoCycle — página inicial">
        <img src="/img/logo.png" alt="EcoCycle Reciclagem Inteligente" />
      </a>
      <div class="error-illustration" aria-hidden="true">
        <span class="error-code">403</span>
        <span class="error-icon"><i class="bi bi-shield-lock"></i></span>
      </div>
      <p class="error-label">Acesso restrito</p>
      <h1 id="error-title">Acesso negado</h1>
      <p class="error-description">Seu perfil não tem permissão para acessar esta página ou realizar esta ação.</p>
      <p class="error-hint">Se precisar de acesso, fale com o administrador do sistema.</p>
      <div class="error-actions">
        <a class="btn btn-eco" href="/src/features/dashboard/dashboard.html"><i class="bi bi-house-door" aria-hidden="true"></i> Voltar ao dashboard</a>
        <a class="error-link" href="/src/features/login/login.html" data-switch-account>Entrar com outra conta <i class="bi bi-arrow-right" aria-hidden="true"></i></a>
      </div>
      <footer class="error-footer">EcoCycle <span aria-hidden="true">·</span> Reciclagem inteligente</footer>
    </main>
    <script type="module" src="./errors.js"></script>
  </body>
</html>
