<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários | EcoCycle</title>
</head>
<body>
  <!-- topo, menu lateral e rodapé são preenchidos pelo layout.js -->
  <div id="app-topo"></div>
  <div class="app-corpo">
    <nav id="app-menu" class="menu" aria-label="Menu principal"></nav>
    <main class="conteudo-pagina">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 m-0">Usuários</h1>
        <button id="btn-novo-usuario" class="btn btn-eco btn-sm d-none" data-permissao="usuarios.gerenciar">Novo usuário</button>
      </div>
      <!-- Formulário usado para cadastrar e editar (escondido até abrir; o título muda pelo usuarios.js) -->
      <div class="card shadow-sm mb-3 d-none" id="card-form-usuario">
        <div class="card-header" id="titulo-form">Cadastrar usuário</div>
        <div class="card-body">
          <form id="form-usuario" class="row g-3" novalidate>
            <div id="erro-usuario" class="alert alert-danger py-2 d-none" role="alert"></div>
            <div class="col-md-4"><label class="form-label" for="u-nome">Nome</label><input id="u-nome" class="form-control" maxlength="60"></div>
            <div class="col-md-3"><label class="form-label" for="u-usuario">Usuário</label><input id="u-usuario" class="form-control" maxlength="20"></div>
            <div class="col-md-2"><label class="form-label" for="u-perfil">Perfil</label>
              <select id="u-perfil" class="form-select"><option value="">Escolha</option><option>Administrador</option><option>Gerente</option><option>Operador</option><option>Consulta</option></select></div>
            <div class="col-md-3"><label class="form-label" for="u-senha">Senha</label><input id="u-senha" type="password" class="form-control" autocomplete="new-password"></div>
            <div class="col-12"><button class="btn btn-eco" type="submit">Salvar</button>
              <button class="btn btn-outline-secondary" type="button" id="btn-cancelar">Cancelar</button></div>
          </form>
        </div>
      </div>
      <!-- Tabela de usuários (.estado mostra carregando/erro/vazio; .conteudo recebe a tabela) -->
      <div class="card shadow-sm" id="bloco-usuarios">
        <div class="card-body"><div class="estado"></div><div class="conteudo d-none"></div></div>
      </div>
    </main>
  </div>
  <script type="module" src="users.js"></script>
</body>
</html>
